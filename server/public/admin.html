<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDTI 管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimSun', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #F5F0E6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid rgba(157, 42, 43, 0.5);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            color: #E8D5B7;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9E2A2B;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(157, 42, 43, 0.3);
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(157, 42, 43, 0.3);
        }

        .stat-number {
            font-size: 3.5rem;
            font-weight: bold;
            color: #E8D5B7;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 1.1rem;
            color: #9E2A2B;
            margin-top: 10px;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(157, 42, 43, 0.3);
        }

        .section-title {
            font-size: 1.5rem;
            color: #E8D5B7;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(157, 42, 43, 0.5);
        }

        .distribution-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .type-card {
            background: rgba(157, 42, 43, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(157, 42, 43, 0.4);
        }

        .type-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #E8D5B7;
            margin-bottom: 8px;
        }

        .type-count {
            font-size: 1.8rem;
            color: #9E2A2B;
            font-weight: bold;
        }

        .type-percent {
            font-size: 0.9rem;
            color: rgba(245, 240, 230, 0.7);
            margin-top: 5px;
        }

        .danmaku-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .danmaku-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-left: 3px solid #9E2A2B;
        }

        .danmaku-content {
            color: #F5F0E6;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .danmaku-meta {
            font-size: 0.85rem;
            color: rgba(245, 240, 230, 0.6);
        }

        .danmaku-type {
            color: #9E2A2B;
            font-weight: bold;
        }

        .refresh-btn {
            background: #9E2A2B;
            color: #F5F0E6;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .refresh-btn:hover {
            background: #B33A3A;
            transform: translateY(-2px);
        }

        .online-count {
            display: inline-block;
            background: #9E2A2B;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-left: 15px;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(157, 42, 43, 0.3);
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar-label {
            width: 60px;
            font-size: 0.9rem;
            color: #E8D5B7;
        }

        .bar-container {
            flex: 1;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #9E2A2B, #B33A3A);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .bar-value {
            width: 50px;
            text-align: right;
            font-size: 0.9rem;
            color: #F5F0E6;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #9E2A2B;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .charts-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .distribution-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎋 HDTI 千古帝王人格测试</h1>
            <p class="subtitle">管理后台 <span class="online-count"><span class="online-dot"></span>在线 <span id="onlineCount">0</span> 人</span></p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalTests">0</div>
                <div class="stat-label">总测试人数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalTypes">0</div>
                <div class="stat-label">参与类型数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayTests">0</div>
                <div class="stat-label">今日测试</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">📊 人格类型分布</h2>
            <div class="distribution-grid" id="distributionGrid">
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h3 class="section-title">📈 分布柱状图</h3>
                <div class="bar-chart" id="barChart">
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">💬 实时弹幕 <span id="danmakuCount" style="font-size: 0.9rem; color: rgba(245, 240, 230, 0.6);">（共 0 条）</span></h2>
            <button class="refresh-btn" onclick="loadDanmaku()">🔄 刷新弹幕</button>
            <div class="danmaku-list" id="danmakuList" style="margin-top: 15px;">
                <p style="color: rgba(245, 240, 230, 0.5); text-align: center;">暂无弹幕</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const API_BASE = window.location.origin;
        let socket;
        let statsData = { totalTests: 0, distribution: {} };

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                statsData = data;
                updateStatsUI(data);
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        function updateStatsUI(data) {
            document.getElementById('totalTests').textContent = data.totalTests;

            const typeCount = Object.values(data.distribution).filter(v => v > 0).length;
            document.getElementById('totalTypes').textContent = typeCount;

            const today = new Date().toDateString();
            const todayCount = 0;
            document.getElementById('todayTests').textContent = todayCount;

            const grid = document.getElementById('distributionGrid');
            const types = ['ENTJ', 'INTJ', 'ENFJ', 'INFJ', 'ESTJ', 'ISTJ', 'ESFJ', 'ISFJ',
                          'ESTP', 'ISTP', 'ESFP', 'ISFP', 'ENTP', 'INTP', 'ENFP', 'INFP'];

            grid.innerHTML = types.map(type => {
                const count = data.distribution[type] || 0;
                const percent = data.totalTests > 0 ? ((count / data.totalTests) * 100).toFixed(1) : 0;
                return `
                    <div class="type-card">
                        <div class="type-name">${type}</div>
                        <div class="type-count">${count}</div>
                        <div class="type-percent">${percent}%</div>
                    </div>
                `;
            }).join('');

            updateBarChart(data.distribution, data.totalTests);
        }

        function updateBarChart(distribution, total) {
            const chart = document.getElementById('barChart');
            const types = Object.keys(distribution).sort((a, b) => (distribution[b] || 0) - (distribution[a] || 0));
            const maxCount = Math.max(...Object.values(distribution), 1);

            chart.innerHTML = types.slice(0, 10).map(type => {
                const count = distribution[type] || 0;
                const percent = total > 0 ? ((count / total) * 100).toFixed(1) : 0;
                const width = (count / maxCount) * 100;
                return `
                    <div class="bar-item">
                        <span class="bar-label">${type}</span>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${width}%"></div>
                        </div>
                        <span class="bar-value">${count} (${percent}%)</span>
                    </div>
                `;
            }).join('');
        }

        async function loadDanmaku() {
            try {
                const response = await fetch(`${API_BASE}/api/danmaku/latest`);
                const data = await response.json();
                updateDanmakuUI(data);
            } catch (error) {
                console.error('加载弹幕失败:', error);
            }
        }

        function updateDanmakuUI(danmakuList) {
            const container = document.getElementById('danmakuList');
            document.getElementById('danmakuCount').textContent = `（共 ${danmakuList.length} 条）`;

            if (danmakuList.length === 0) {
                container.innerHTML = '<p style="color: rgba(245, 240, 230, 0.5); text-align: center;">暂无弹幕</p>';
                return;
            }

            container.innerHTML = danmakuList.map(d => `
                <div class="danmaku-item">
                    <div class="danmaku-content">${escapeHtml(d.content)}</div>
                    <div class="danmaku-meta">
                        <span class="danmaku-type">${d.mbti_type || '未知'}</span>
                        &nbsp;|&nbsp;
                        ${d.username}
                        &nbsp;|&nbsp;
                        ${new Date(d.created_at).toLocaleString('zh-CN')}
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function connectSocket() {
            socket = io(API_BASE);

            socket.on('connect', () => {
                console.log('已连接到服务器');
                socket.emit('join', { role: 'admin' });
            });

            socket.on('stats-update', (data) => {
                statsData = data;
                updateStatsUI(data);
            });

            socket.on('new-danmaku', (danmaku) => {
                loadDanmaku();
            });

            socket.on('disconnect', () => {
                console.log('与服务器断开连接');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadDanmaku();
            connectSocket();

            setInterval(loadStats, 10000);
        });
    </script>
</body>
</html>
